<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/js/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #F7F3EA; color: #3A2A10; }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="23.75" data-width="1920" data-height="1080" data-fps="30">
      <!-- The whole film is one scene host: the phone persists across scenes, so the scenes share a timeline. -->
      <div id="film" class="clip" data-composition-id="film" data-composition-src="compositions/film.html"
        data-start="0" data-duration="23.75" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>

      <!-- Music: a low bed, out under the wordmark. Credit: Sascha Ende, ende.app (CC BY 4.0) -->
      <audio id="music" class="clip" data-start="0" data-duration="23.75" data-track-index="10" data-volume="0.28" data-fade-in="0.5" data-fade-out="1.5"
        src="assets/music/happy-beats-business-moves-vol-11-by-ende-dot-app.mp3"></audio>
      <!-- Six sounds, each with a cause on screen -->
      <audio id="sfx-flip" class="clip" data-start="3.62" data-duration="0.6" data-track-index="11" data-volume="0.4" src="assets/sfx/card-slide-1.ogg"></audio>
      <audio id="sfx-phone" class="clip" data-start="6.34" data-duration="0.12" data-track-index="11" data-volume="0.5" src="assets/sfx/impactSoft_medium_000.ogg"></audio>
      <audio id="sfx-tap" class="clip" data-start="13.7" data-duration="0.19" data-track-index="11" data-volume="0.45" src="assets/sfx/drop_002.ogg"></audio>
      <audio id="sfx-sheet" class="clip" data-start="14.76" data-duration="0.6" data-track-index="12" data-volume="0.35" src="assets/sfx/card-slide-1.ogg"></audio>
      <audio id="sfx-tile1" class="clip" data-start="15.28" data-duration="0.26" data-track-index="11" data-volume="0.5" src="assets/sfx/impactWood_light_000.ogg"></audio>
      <audio id="sfx-tile2" class="clip" data-start="15.81" data-duration="0.26" data-track-index="11" data-volume="0.5" src="assets/sfx/impactWood_light_001.ogg"></audio>
      <audio id="sfx-name" class="clip" data-start="21.07" data-duration="1.48" data-track-index="11" data-volume="0.4" src="assets/sfx/impactBell_heavy_000.ogg"></audio>
    </div>
    <script>
      // The root holds only the scene host and audio; the film drives its own timeline.
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
